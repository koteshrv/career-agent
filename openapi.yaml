{
  "info": {
    "name": "Career Agent API",
    "description": "Postman collection for testing the Career Agent API locally.",
    "schema": "https://schema.getpostman.com/json/collection/v2.1.0/collection.json"
  },
  "item": [
    {
      "name": "0. API Info",
      "request": {
        "method": "GET",
        "header": [],
        "url": {
          "raw": "{{base_url}}/",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            ""
          ]
        },
        "description": "Unauthenticated. Basic metadata and links — not part of the versioned API surface."
      },
      "response": []
    },
    {
      "name": "1. SSO Login",
      "event": [
        {
          "listen": "test",
          "script": {
            "exec": [
              "var jsonData = pm.response.json();",
              "if (jsonData.token || jsonData.access_token) {",
              "    pm.collectionVariables.set(\"jwt_token\", jsonData.token || jsonData.access_token);",
              "    console.log(\"JWT Token saved to collection variables!\");",
              "}"
            ],
            "type": "text/javascript"
          }
        }
      ],
      "request": {
        "method": "POST",
        "header": [
          {
            "key": "Content-Type",
            "value": "application/json",
            "type": "text"
          }
        ],
        "body": {
          "mode": "raw",
          "raw": "{\n    \"idp_token\": \"PASTE_REAL_TOKEN_HERE\",\n    \"sso_provider\": \"github\"\n}"
        },
        "url": {
          "raw": "{{base_url}}/v1/auth/login",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "auth",
            "login"
          ]
        },
        "description": "Simulates the frontend sending SSO details. Automatically saves the returned JWT to a collection variable."
      },
      "response": []
    },
    {
      "name": "2. Push Jobs (Give to Get)",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "POST",
        "header": [
          {
            "key": "Content-Type",
            "value": "application/json",
            "type": "text"
          }
        ],
        "body": {
          "mode": "raw",
          "raw": "{\n    \"jobs\": [\n        {\n            \"company\": \"TechCorp\",\n            \"title\": \"Software Engineer\",\n            \"location\": \"Remote\",\n            \"url\": \"https://techcorp.com/jobs/1\"\n        },\n        {\n            \"company\": \"InnoSys\",\n            \"title\": \"Frontend Developer\",\n            \"location\": \"New York, NY\",\n            \"url\": \"https://innosys.com/jobs/2\"\n        }\n    ]\n}"
        },
        "url": {
          "raw": "{{base_url}}/v1/jobs/push",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "jobs",
            "push"
          ]
        },
        "description": "Uploads scraped jobs and earns credits. Requires JWT token."
      },
      "response": []
    },
    {
      "name": "3. Pull Jobs (Consume)",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "GET",
        "header": [],
        "url": {
          "raw": "{{base_url}}/v1/jobs/pull?limit=5",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "jobs",
            "pull"
          ],
          "query": [
            {
              "key": "limit",
              "value": "5"
            }
          ]
        },
        "description": "Pulls the latest jobs and deducts credits. Requires JWT token. Jobs older than 60 days are excluded by default — add &include_stale=true to the URL to include them."
      },
      "response": []
    },
    {
      "name": "4. Report a Job",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "POST",
        "header": [
          {
            "key": "Content-Type",
            "value": "application/json",
            "type": "text"
          }
        ],
        "body": {
          "mode": "raw",
          "raw": "{\n    \"job_id\": \"PASTE_JOB_ID_FROM_PULL\",\n    \"reason\": \"dead_link\"\n}"
        },
        "url": {
          "raw": "{{base_url}}/v1/jobs/report",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "jobs",
            "report"
          ]
        },
        "description": "Report a pulled job as fake or dead. 3 distinct reports flag the job and penalise the contributor."
      },
      "response": []
    },
    {
      "name": "5. Get Account Info",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "GET",
        "header": [],
        "url": {
          "raw": "{{base_url}}/v1/me",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "me"
          ]
        },
        "description": "Current credit balance, contribution stats, remaining daily quota and push-credit allowance."
      },
      "response": []
    },
    {
      "name": "6. Health Check",
      "request": {
        "method": "GET",
        "header": [],
        "url": {
          "raw": "{{base_url}}/health",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "health"
          ]
        },
        "description": "Unauthenticated liveness probe; also verifies the PostgreSQL database responds."
      },
      "response": []
    },
    {
      "name": "7. Logout Everywhere",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "POST",
        "header": [],
        "url": {
          "raw": "{{base_url}}/v1/auth/logout-all",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "auth",
            "logout-all"
          ]
        },
        "description": "Invalidates every JWT previously issued to this account, including the one used to call this. Deliberately sent with no body/Content-Type — an empty JSON body would be rejected by Fastify before the handler runs."
      },
      "response": []
    },
    {
      "name": "8. Export My Data",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "GET",
        "header": [],
        "url": {
          "raw": "{{base_url}}/v1/me/export",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "me",
            "export"
          ]
        },
        "description": "Self-service export: profile, jobs contributed, jobs pulled, reports filed."
      },
      "response": []
    },
    {
      "name": "9. Delete My Account",
      "request": {
        "auth": {
          "type": "bearer",
          "bearer": [
            {
              "key": "token",
              "value": "{{jwt_token}}",
              "type": "string"
            }
          ]
        },
        "method": "DELETE",
        "header": [
          {
            "key": "Content-Type",
            "value": "application/json",
            "type": "text"
          }
        ],
        "body": {
          "mode": "raw",
          "raw": "{\n    \"confirm\": true\n}"
        },
        "url": {
          "raw": "{{base_url}}/v1/me",
          "host": [
            "{{base_url}}"
          ],
          "path": [
            "v1",
            "me"
          ]
        },
        "description": "Deletes this account and its own activity records. Jobs it contributed are kept (attribution detached), not deleted. Irreversible."
      },
      "response": []
    },
    {
      "name": "Admin",
      "description": "Requires the calling account to have is_admin = true (no self-service way to set this — see DATABASE_QUERIES.md). Use {{admin_jwt_token}}, obtained by logging in as an admin account via request #1 and copying its token here. A non-admin gets 404 from all of these, not 403.",
      "item": [
        {
          "name": "Look Up Users By Email",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/users?email=user@example.com",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "users"
              ],
              "query": [
                {
                  "key": "email",
                  "value": "user@example.com"
                }
              ]
            },
            "description": "Email is not unique (accounts are keyed on sso_provider + provider_user_id), so this can return more than one account for the same address."
          },
          "response": []
        },
        {
          "name": "Get User",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/users/{{target_user_id}}",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "users",
                "{{target_user_id}}"
              ]
            }
          },
          "response": []
        },
        {
          "name": "Set Credit Balance",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "POST",
            "header": [
              {
                "key": "Content-Type",
                "value": "application/json",
                "type": "text"
              }
            ],
            "body": {
              "mode": "raw",
              "raw": "{\n    \"credits\": 50000\n}"
            },
            "url": {
              "raw": "{{base_url}}/v1/admin/users/{{target_user_id}}/credits",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "users",
                "{{target_user_id}}",
                "credits"
              ]
            },
            "description": "Sets the absolute balance (not a delta)."
          },
          "response": []
        },
        {
          "name": "Ban User",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "POST",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/users/{{target_user_id}}/ban",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "users",
                "{{target_user_id}}",
                "ban"
              ]
            }
          },
          "response": []
        },
        {
          "name": "Unban User",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "POST",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/users/{{target_user_id}}/unban",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "users",
                "{{target_user_id}}",
                "unban"
              ]
            }
          },
          "response": []
        },
        {
          "name": "List Flagged Jobs",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/jobs/flagged?limit=50",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "jobs",
                "flagged"
              ],
              "query": [
                {
                  "key": "limit",
                  "value": "50"
                }
              ]
            }
          },
          "response": []
        },
        {
          "name": "Unflag a Job",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "POST",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/jobs/{{target_job_id}}/unflag",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "jobs",
                "{{target_job_id}}",
                "unflag"
              ]
            },
            "description": "Restores a job to circulation, e.g. after review finds a report was a false positive."
          },
          "response": []
        },
        {
          "name": "Who Reported a Job",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/jobs/{{target_job_id}}/reports",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "jobs",
                "{{target_job_id}}",
                "reports"
              ]
            },
            "description": "Works for any job, not just already-flagged ones."
          },
          "response": []
        },
        {
          "name": "Audit Log",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/audit-log?limit=50",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "audit-log"
              ],
              "query": [
                {
                  "key": "limit",
                  "value": "50"
                }
              ]
            },
            "description": "Every write made through /v1/admin/* — who did what, when."
          },
          "response": []
        },
        {
          "name": "Aggregate Stats",
          "request": {
            "auth": {
              "type": "bearer",
              "bearer": [
                {
                  "key": "token",
                  "value": "{{admin_jwt_token}}",
                  "type": "string"
                }
              ]
            },
            "method": "GET",
            "header": [],
            "url": {
              "raw": "{{base_url}}/v1/admin/stats",
              "host": [
                "{{base_url}}"
              ],
              "path": [
                "v1",
                "admin",
                "stats"
              ]
            },
            "description": "Total users/jobs/reports/flags plus the top 10 contributors by jobs pushed."
          },
          "response": []
        }
      ]
    }
  ],
  "variable": [
    {
      "key": "base_url",
      "value": "http://localhost:3000",
      "type": "string"
    },
    {
      "key": "jwt_token",
      "value": "",
      "type": "string"
    },
    {
      "key": "admin_jwt_token",
      "value": "",
      "type": "string",
      "description": "Token for an account with is_admin = true. Log in as that account via request #1 and paste its token here (or reuse jwt_token if the same account is both)."
    },
    {
      "key": "target_user_id",
      "value": "",
      "type": "string",
      "description": "UUID of the user an Admin request acts on."
    },
    {
      "key": "target_job_id",
      "value": "",
      "type": "string",
      "description": "UUID of the job an Admin request acts on."
    }
  ]
}
