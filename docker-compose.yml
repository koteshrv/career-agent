version: '3.8'

services:
  backend:
    image: ghcr.io/koteshrv/career-agent-backend:main
    ports:
      - "8000:8000"
    volumes:
      # Mount a single data directory for all databases and encryption keys
      - ./data:/app/data
      # Bootstrap config (login credentials, DB path) — copy backend/config.example.json to
      # ./backend-config.json and edit it before exposing this app past localhost. Everything
      # else (Gemini/Telegram/OpenAI keys, healthcheck URL, crowdsourcing token) lives in the
      # Settings UI instead, not here.
      - ./backend-config.json:/app/data/config.json
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    image: ghcr.io/koteshrv/career-agent-frontend:main
    ports:
      - "5173:80"
    volumes:
      # Public, non-secret deployment config (OAuth client IDs, API URLs) — copy
      # frontend/public/runtime-config.json to ./frontend-config.json and fill in your own
      # values. Mounted at runtime so the same published image works for every self-hoster
      # without rebuilding.
      - ./frontend-config.json:/usr/share/nginx/html/runtime-config.json:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
