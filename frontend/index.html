<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareerAgent | Automate the job hunt.</title>

    <meta name="description" content="CareerAgent is a free, open-source, local-first AI job search tool. Automate job scraping, score matches against your resume with AI, and generate tailored LaTeX CVs — all running privately on your machine." />
    <meta name="keywords" content="career agent, open source ATS, AI job search, local job scraper, resume builder, latex cv generator, privacy job search, docker job automation, job hunt automation, reverse ATS, no accounts job search, free job search tool" />
    <meta name="author" content="koteshrv" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://careeragent.fyi/" />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://careeragent.fyi/" />
    <meta property="og:title" content="CareerAgent — Automate the job hunt. Keep your privacy intact." />
    <meta property="og:description" content="Free, open-source AI job search that runs locally. Scrapes jobs, scores them against your resume, and generates tailored LaTeX CVs. No accounts, no cloud, 100% private." />
    <meta property="og:image" content="https://careeragent.fyi/favicon.svg" />
    <meta property="og:site_name" content="CareerAgent" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://careeragent.fyi/" />
    <meta name="twitter:title" content="CareerAgent — Automate the job hunt. Keep your privacy intact." />
    <meta name="twitter:description" content="Free, open-source AI job search that runs locally. Scrapes jobs, scores them against your resume, and generates tailored LaTeX CVs. No accounts, no cloud, 100% private." />
    <meta name="twitter:image" content="https://careeragent.fyi/favicon.svg" />

    <!-- JSON-LD Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "CareerAgent",
      "url": "https://careeragent.fyi",
      "description": "Free, open-source, local-first AI job search automation. Scrapes job boards, scores every listing against your resume using AI, generates tailored LaTeX CVs, and tracks your pipeline. Features an optional opt-in crowdsourced job network (career-agent-api) that shares only public job listing data — your resume and personal data never leave your machine. No accounts, no cloud, no telemetry.",
      "applicationCategory": "ProductivityApplication",
      "operatingSystem": "Linux, macOS, Windows (via Docker)",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "author": {
        "@type": "Person",
        "name": "koteshrv",
        "url": "https://github.com/koteshrv"
      },
      "codeRepository": "https://github.com/koteshrv/career-agent",
      "license": "https://opensource.org/licenses/MIT",
      "keywords": "job search automation, AI resume scoring, LaTeX CV generator, open source ATS, local job scraper, privacy job hunt, Docker job automation"
    }
    </script>

  
    <script>
      (function() {
        const stored = localStorage.getItem('career_agent_theme');
        if (stored === 'light' || (!stored && window.matchMedia('(prefers-color-scheme: light)').matches)) {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
  </head>

  <body class="bg-background text-foreground antialiased selection:bg-blue-500/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
